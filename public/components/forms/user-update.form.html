<div class="modal-form">
  <div class="modal-form-group">
    <label for="modal-user-username" class="modal-form-label"
      ><span class="required-field">*</span>Username</label
    >
    <input
      placeholder="John Doe"
      id="modal-user-username"
      data-js="modal-user-update-username"
      class="modal-form-input"
      disabled
    />
  </div>
  <div class="modal-form-group">
    <label for="modal-user-email" class="modal-form-label"
      ><span class="required-field">*</span>Email</label
    >
    <input
      type="email"
      placeholder="john.doe@issuexpert.com"
      id="modal-user-email"
      data-js="modal-user-update-email"
      class="modal-form-input"
      required
    />
  </div>
  <div class="modal-form-group">
    <label class="modal-form-label"
      ><span class="required-field">*</span>Role</label
    >

    <div class="modal-form-radio-container">
      <label>
        <input
          type="radio"
          name="role"
          value="admin"
          data-js="modal-user-update-role"
        />
        Admin
      </label>

      <label>
        <input
          type="radio"
          name="role"
          value="technician"
          data-js="modal-user-update-role"
        />
        Technician
      </label>

      <label>
        <input
          type="radio"
          name="role"
          value="user"
          data-js="modal-user-update-role"
          checked
        />
        User
      </label>
    </div>
  </div>
</div>
