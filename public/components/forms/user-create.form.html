<div class="modal-form">
  <div class="modal-form-group">
    <label for="modal-user-username" class="modal-form-label">Username</label>
    <input
      placeholder="John Doe"
      id="modal-user-username"
      data-js="modal-user-create-username"
      class="modal-form-input"
      required
    />
  </div>
  <div class="modal-form-group">
    <label for="modal-user-email" class="modal-form-label">Email</label>
    <input
      type="email"
      placeholder="john.doe@issuexpert.com"
      id="modal-user-email"
      data-js="modal-user-create-email"
      class="modal-form-input"
      required
    />
  </div>
  <div class="modal-form-group">
    <label for="modal-user-password" class="modal-form-label">Password</label>
    <input
      placeholder="••••••••"
      type="password"
      id="modal-user-password"
      data-js="modal-user-create-password"
      class="modal-form-input"
      required
    />
  </div>
  <div class="modal-form-group">
    <label class="modal-form-label">Role</label>

    <div class="modal-form-radio-container">
      <label>
        <input
          type="radio"
          name="role"
          value="admin"
          data-js="modal-user-create-role"
        />
        Admin
      </label>

      <label>
        <input
          type="radio"
          name="role"
          value="technician"
          data-js="modal-user-create-role"
        />
        Technician
      </label>

      <label>
        <input
          type="radio"
          name="role"
          value="user"
          data-js="modal-user-create-role"
          checked
        />
        User
      </label>
    </div>
  </div>
</div>
