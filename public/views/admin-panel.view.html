<div class="main-container">
  <h2>Admin Panel</h3>

  <div class="admin-panel-tab-btn-container">
    <button
      data-js="admin-panel-tab-users"
      class="btn btn-secondary"
    >
      Users
    </button>

    <button
      data-js="admin-panel-tab-tickets"
      class="btn btn-secondary"
    >
      Tickets
    </button>

    <button
      data-js="admin-panel-tab-categories"
      class="btn btn-secondary"
    >
    Categories
  </button>
</div>

  <!-- Users -->

    <div class="table-header">
      <h4>All users</h4>
      <div class="table-actions">
        <button data-js="admin-panel-user-update-btn" class="btn btn-clean btn-mini">
          <svg width="256px" height="256px" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
            <path d="M20,16v4a2,2,0,0,1-2,2H4a2,2,0,0,1-2-2V6A2,2,0,0,1,4,4H8"/>
            <polygon points="12.5 15.8 22 6.2 17.8 2 8.3 11.5 8 16 12.5 15.8"/>
          </svg>
        </button>
        <button data-js="admin-panel-user-delete-btn" class="btn btn-clean btn-mini">
          <svg width="256px" height="256px" viewBox="3 1 18 22" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 7V18C6 19.1046 6.89543 20 8 20H16C17.1046 20 18 19.1046 18 18V7M6 7H5M6 7H8M18 7H19M18 7H16M10 11V16M14 11V16M8 7V5C8 3.89543 8.89543 3 10 3H14C15.1046 3 16 3.89543 16 5V7M8 7H16"/>

            <path d="M11 8C11 7.44772 11.4477 7 12 7C12.5523 7 13 7.44772 13 8V11H16C16.5523 11 17 11.4477 17 12C17 12.5523 16.5523 13 16 13H13V16C13 16.5523 12.5523 17 12 17C11.4477 17 11 16.5523 11 16V13H8C7.44771 13 7 12.5523 7 12C7 11.4477 7.44772 11 8 11H11V8Z"/>

        </button>
      </div>
    </div>
    <div data-js="admin-panel-users-table-body" data-name="users" class="table-body">
    </div>
  </div>

        <div data-js="admin-panel-categories-table-th-id" class="cell">ID</div>
