<div class="header-sidebar">
  <div class="header-sidebar-top">
    <div class="header-sidebar-logo">
      <img class="header-sidebar-logo-img" src="assets/logo.svg" alt="Logo" />
      <div class="header-sidebar-logo-title-container">
        <div class="header-sidebar-logo-title">IssueXpert</div>
      </div>
    </div>

    <nav class="header-sidebar-list-container">
      <button
        class="header-sidebar-list-item active"
        data-list="all-tickets"
        title="Show all tickets"
      >
        <svg
          width="256px"
          height="256px"
          viewBox="0 0 24 24"
          fill="none"
          stroke="black"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"
          />
          <rect x="9" y="3" width="6" height="4" rx="1" />
          <path d="M9 12h6M9 16h4" />
        </svg>
        <span class="header-sidebar-list-item-text">All Tickets</span>
      </button>

      <button
        class="header-sidebar-list-item"
        data-list="assigned-tickets"
        title="Show tickets assigned to me"
      >
        <svg
          width="256px"
          height="256px"
          viewBox="0 0 24 24"
          fill="none"
          stroke="black"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          xmlns="http://www.w3.org/2000/svg"
        >
          <rect x="2" y="7" width="20" height="14" rx="2"></rect>
          <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"></path>
        </svg>
        <span class="header-sidebar-list-item-text">Assigned</span>
      </button>

      <button
        class="header-sidebar-list-item"
        data-list="owned-tickets"
        title="Show tickets created by me"
      >
        <svg
          width="256px"
          height="256px"
          viewBox="0 0 24 24"
          fill="none"
          stroke="black"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          xmlns="http://www.w3.org/2000/svg"
        >
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"></path>
        </svg>
        <span class="header-sidebar-list-item-text">My Tickets</span>
      </button>
    </nav>
  </div>

            height="256px"
